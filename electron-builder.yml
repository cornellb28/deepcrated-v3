appId: com.deepcrated.app
productName: DeepCrated
directories:
  buildResources: build
# An allow-list, not a deny-list: only the built app goes into app.asar.
# package.json and the production node_modules are added by electron-builder
# itself. The old deny-list packed the whole repo, which would have shipped
# the sidecar venv, tests, docs, supabase/ and — worst — backups/ and the
# delimiter dry-run files, which hold copies of the developer's own library.
files:
  - out/**
  - resources/**
  # Every platform's fpcalc is fetched into resources/fpcalc/; each build
  # ships only its own copy, via extraResources below.
  - '!resources/fpcalc/**'
asarUnpack:
  - resources/**
# The PyInstaller sidecar builds (analyze/, edit_tags/ — one folder each,
# see sidecar/build.sh), made before packaging. The packaged app runs them
# from <resources>/sidecar/<name>/<name> (getPython in src/main/sidecar.ts);
# without them it cannot read tags, analyze or import anything.
extraResources:
  - from: sidecar/dist
    to: sidecar
    filter:
      - analyze/**
      - edit_tags/**
  # Chromaprint fpcalc for this build's platform and arch only, fetched and
  # checksum-verified by scripts/fetch-fpcalc.mjs into
  # resources/fpcalc/<platform>-<arch>/. Lands at <resources>/fpcalc/, where
  # getFpcalc() (src/main/identity/fpcalc.ts) looks first. Licence notices
  # ship with resources/licenses/. The executable bit is kept from the file.
  - from: resources/fpcalc/${platform}-${arch}
    to: fpcalc
    filter:
      - fpcalc
      - fpcalc.exe
# Deep link for the OAuth and password-reset callbacks. app.setAsDefault-
# ProtocolClient registers this at runtime, which is what makes it work in
# dev, but a PACKAGED app needs the scheme declared in its bundle too:
# electron-builder turns this into CFBundleURLTypes on macOS and the
# equivalent registry entries on Windows. Without it the browser has nothing
# to hand deepcrated://auth-callback back to, and sign-in dead-ends in the
# browser on a machine that has never run the app from source.
protocols:
  - name: DeepCrated
    schemes:
      - deepcrated
      # Registered too and accepted at runtime (CALLBACK_PROTOCOLS in authCallback.ts).
      # Contract v4.2 names cratecloud as the desktop scheme; installed apps rely on it.
      - cratecloud
win:
  executableName: deepcrated-v3
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Ad-hoc signature: enough for testers on Apple Silicon (they open it once
  # with right-click > Open). TODO(release): replace with a Developer ID
  # Application identity and turn notarize on before any public download.
  identity: '-'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  # e.g. DeepCrated-1.0.0-arm64.dmg (productName, not the npm package name).
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
